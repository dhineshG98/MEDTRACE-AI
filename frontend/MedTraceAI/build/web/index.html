<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Autonomous clinical intelligence, multi-modal medical records ingestion, and traceable AI Copilot.">

  <!-- Google Sign-In OAuth Client ID -->
  <meta name="google-signin-client_id" content="425303006402-rf8fgf9u151d4u9fgfj59ti2cdc65rnt.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MedTrace AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MedTrace AI — Autonomous Clinical Intelligence & Trace Platform</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Libre Franklin -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'Univers';
      src: local('Univers'), local('Univers 55'), local('Univers 65 Bold'), local('UniversLTStd'), local('Helvetica Neue'), local('Helvetica'), local('Arial');
    }
    body {
      background-color: #07090E;
      margin: 0;
      padding: 0;
      font-family: 'Libre Franklin', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    #medtrace-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: radial-gradient(circle at 50% 40%, #0F131D 0%, #07090E 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 40px;
      border-radius: 20px;
      background: rgba(18, 22, 34, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }

    .pulse-ring-container {
      position: relative;
      width: 76px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid #00F0FF;
      opacity: 0;
      animation: pulseAnim 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    .pulse-ring:nth-child(2) {
      animation-delay: 0.7s;
    }

    .logo-badge {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: linear-gradient(135deg, #161A26 0%, #0B0E17 100%);
      border: 1px solid rgba(0, 240, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.25);
    }

    .title-text {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .subtitle-text {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }

    .progress-track {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #00F0FF, #7B2CBF);
      border-radius: 999px;
      animation: progressAnim 1.6s ease-in-out infinite;
    }

    .status-text {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      font-weight: 500;
    }

    .troubleshoot-btn {
      display: none;
      margin-top: 18px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #FFFFFF;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .troubleshoot-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    @keyframes pulseAnim {
      0% { transform: scale(0.6); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    @keyframes progressAnim {
      0% { left: -40%; width: 30%; }
      50% { left: 30%; width: 50%; }
      100% { left: 100%; width: 40%; }
    }
  </style>
</head>
<body>
  <!-- High-Tech Medical Clinical Loader -->
  <div id="medtrace-loader">
    <div class="loader-card">
      <div class="pulse-ring-container">
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="logo-badge">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#00F0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </div>
      </div>
      <div class="title-text">MEDTRACE AI</div>
      <div class="subtitle-text">Autonomous Clinical Intelligence Platform</div>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <div id="loader-status" class="status-text">Initializing clinical trajectory engine...</div>
      <button id="reload-btn" class="troubleshoot-btn" onclick="window.location.reload()">Reload MedTrace AI</button>
    </div>
  </div>

  <script>
    // Smoothly remove loading screen when Flutter is rendered
    function hideLoader() {
      var loader = document.getElementById('medtrace-loader');
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.style.display = 'none';
        }, 500);
      }
    }

    // Listen for Flutter's first frame event
    window.addEventListener('flutter-first-frame', hideLoader);

    // Backup: MutationObserver to detect Flutter DOM mount (<flt-glass-pane> or <flt-scene-host>)
    var observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flt-glass-pane') || document.querySelector('flt-scene-host') || document.querySelector('flutter-view')) {
        hideLoader();
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Fallback: If after 10s Flutter hasn't mounted, show helpful troubleshooting button
    setTimeout(function() {
      var status = document.getElementById('loader-status');
      var btn = document.getElementById('reload-btn');
      if (status && document.getElementById('medtrace-loader').style.display !== 'none') {
        status.innerText = 'Finalizing clinical assets...';
        if (btn) btn.style.display = 'inline-block';
      }
    }, 10000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
