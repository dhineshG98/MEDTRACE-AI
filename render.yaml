# ─── Render Deployment ────────────────────────────────────────────────
# MedTrace AI FastAPI Backend
# Docs: https://render.com/docs/deploy-fastapi
# ──────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: medtrace-ai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: AI_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.1-flash-lite
      - key: MEDTRACE_ENCRYPTION_KEY
        generateValue: true
      - key: API_AUTH_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://medtrace-ai-web.onrender.com,https://medtrace-ai.netlify.app,https://medtraceai.netlify.app,http://localhost:8080,http://localhost:3000"

  - type: web
    name: medtrace-ai-web
    runtime: static
    staticPublishPath: frontend/MedTraceAI/build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
